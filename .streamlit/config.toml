[theme]
primaryColor = "#1B1B1B"
backgroundColor = "#FCFBF8"
secondaryBackgroundColor = "#F3F1EC"
textColor = "#1B1B1B"

[browser]
gatherUsageStats = false

[server]
# Rerun the open app as soon as source files are saved. Polling is the most
# reliable watcher on macOS when editors write via atomic file replacement.
runOnSave = true
fileWatcherType = "poll"
